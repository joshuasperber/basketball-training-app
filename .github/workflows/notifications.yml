name: Notification dispatch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch due reminders
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://basketball-training-app-tau.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET fehlt — Push-Versand wird übersprungen."
            exit 0
          fi
          curl --fail --silent --show-error \
            --retry 2 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/notifications/dispatch"
